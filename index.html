<!DOCTYPE html> <!-- Tells the browser this is HTML5 -->

<head> <!-- Contains page settings -->
    <meta charset="UTF-8"> <!-- Supports standard text characters -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- Makes the page responsive -->
    <title>Jenkins Deployment</title> <!-- Sets the browser tab title -->
